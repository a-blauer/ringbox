<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Card search, collection tracker, deck builder and camera scanner for Decipher's Lord of the Rings TCG.">
<title>RingBox — LOTR TCG</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="icon-btn back" id="backBtn" aria-label="Back" hidden>
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <h1 id="viewTitle">RingBox</h1>
  <div class="top-actions" id="topActions"></div>
</header>

<main id="view" tabindex="-1">
  <div class="loading"><div class="ring-spin"></div><p>Loading the card archive…</p></div>
</main>

<nav class="tabs" id="tabs">
  <a href="#search" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><span>Search</span></a>
  <a href="#collection" data-tab="collection"><svg viewBox="0 0 24 24"><rect x="4" y="3.5" width="12" height="16" rx="1.5"/><path d="M8 20.5h10.5a1.5 1.5 0 0 0 1.5-1.5V7"/></svg><span>Collection</span></a>
  <a href="#scan" data-tab="scan" class="scan-tab"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8.5" y="7.5" width="7" height="9" rx="1"/></svg><span>Scan</span></a>
  <a href="#decks" data-tab="decks"><svg viewBox="0 0 24 24"><rect x="7" y="4" width="11" height="15" rx="1.5" transform="rotate(8 12 12)"/><rect x="5" y="5" width="11" height="15" rx="1.5"/></svg><span>Decks</span></a>
  <a href="#more" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg><span>More</span></a>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-scrim" data-close></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="scan.js"></script>
</body>
</html>
